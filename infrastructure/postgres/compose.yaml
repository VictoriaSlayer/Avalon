name: postgres

services:
  postgres:
    image: postgres:17
    container_name: bi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in local .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in local .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in local .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - study_data:/var/lib/postgresql/data
    networks:
      - bi-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  study_data:

networks:
  bi-net:
    external: true
